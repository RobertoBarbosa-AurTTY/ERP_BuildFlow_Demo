# Front-end: Next.js exportado como site estático (web/out).
# Back-end: Netlify Functions em netlify/functions, expostas em /api/*
# (ainda não usadas pelo front novo, que roda com dados de demonstração).
[build]
  command = "npm ci --prefix web && npm run build --prefix web"
  publish = "web/out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Arquivos com hash no nome podem ficar em cache para sempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/dashboard/"
  status = 302
