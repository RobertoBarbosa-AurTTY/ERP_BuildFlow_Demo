name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit:
    name: Lint + Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  integration:
    name: Integration + baseline
    runs-on: ubuntu-latest
    if: ${{ secrets.MONGODB_URI != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Captura de baseline (estado atual)
        run: npm run capture-baseline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - name: Integration tests (dados de produção, só leitura + cleanup)
        run: npm run test:integration
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - name: Comparação de baseline
        run: npm run compare-baseline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
