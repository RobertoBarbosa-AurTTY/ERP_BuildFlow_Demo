<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildFlow - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: stretch;
        }
        .auth-brand {
            flex: 1;
            background: linear-gradient(135deg, #0a0f1e 0%, #1a1040 50%, #0f1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            position: relative;
            overflow: hidden;
        }
        .auth-brand::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(79,70,229,0.15), transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
        }
        .auth-brand::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139,92,246,0.1), transparent 70%);
            bottom: -80px;
            left: -80px;
            border-radius: 50%;
        }
        .auth-brand-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .auth-brand-icon {
            font-size: 4.5rem;
            background: linear-gradient(135deg, var(--brand), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }
        .auth-brand h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 16px;
        }
        .auth-brand h1 span {
            color: var(--text-primary);
        }
        .auth-brand p {
            color: rgba(255,255,255,0.5);
            font-size: 1.1rem;
            max-width: 320px;
            line-height: 1.6;
        }
        .auth-brand-features {
            margin-top: 48px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }
        .auth-brand-feature {
            display: flex;
            align-items: center;
            gap: 14px;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
        }
        .auth-brand-feature i {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(79,70,229,0.15);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .auth-form-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--bg-primary);
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
        }
        .auth-card-header {
            margin-bottom: 40px;
        }
        .auth-card-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .auth-card-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: var(--bg-input);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--brand), #6d28d9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .auth-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        @media (max-width: 768px) {
            .auth-container {
                flex-direction: column;
            }
            .auth-brand {
                display: none;
            }
            .auth-form-side {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-brand">
            <div class="auth-brand-content">
                <div class="auth-brand-icon">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <h1>Build<span>Flow</span></h1>
                <p>Gestão inteligente para seu negócio com performance e confiabilidade.</p>
                <div class="auth-brand-features">
                    <div class="auth-brand-feature">
                        <i class="fa-solid fa-cubes"></i>
                        <span>Controle de estoque completo</span>
                    </div>
                    <div class="auth-brand-feature">
                        <i class="fa-solid fa-cash-register"></i>
                        <span>PDV ágil com emissão de orçamentos</span>
                    </div>
                    <div class="auth-brand-feature">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Relatórios e analytics operacional</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="auth-form-side">
            <div class="auth-card">
                <div class="auth-card-header">
                    <h2>Entrar</h2>
                    <p>Informe suas credenciais para acessar o sistema.</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="text" id="username" class="form-input" placeholder="E-mail ou usuário" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="form-input" placeholder="Sua senha" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-login" id="loginBtn">
                        ENTRAR NO SISTEMA
                    </button>
                </form>
                <div class="auth-footer">
                    <p>&copy; 2026 BuildFlow S.A. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            try {
                btn.disabled = true;
                btn.innerText = 'AUTENTICANDO...';

                await BuildFlow.login(email, pass);
                window.location.href = '/dashboard';
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Erro de Autenticação',
                    text: error.message || 'Erro ao realizar login',
                    confirmButtonColor: '#4f46e5'
                });
                btn.disabled = false;
                btn.innerText = 'ENTRAR NO SISTEMA';
            }
        });
    </script>
</body>
</html>
